[project]
name = "looklab-ml"
version = "0.1.0"
description = "LookLab AI vision, recommendation and try-on components"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Florence-2 / Qwen local inference through transformers (CPU or GPU)
vision-models = ["torch>=2.2", "transformers>=4.45", "einops", "timm"]
# FASHN VTON v1.5. Install fashn-vton itself from its git repo, see docs/TRYON_SETUP.md
# sam2 (Apache-2.0) cuts garments for the layered mode; it also pulls hydra-core and iopath
tryon = ["torch>=2.2", "torchvision", "safetensors", "huggingface_hub", "opencv-python-headless", "einops", "onnxruntime-gpu", "matplotlib", "tqdm", "sam2>=1.1.0,<2"]
creative = ["torch>=2.2", "diffusers>=0.35", "transformers>=4.45", "accelerate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["looklab_ml"]
